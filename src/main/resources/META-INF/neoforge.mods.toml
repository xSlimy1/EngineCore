[[mods]]
modId="enginecore"
version="1.0.0"
displayName="EngineCore"
logoFile="Logo.png"
authors="Da-Slimy"
credits="Created and developed by Da-Slimy"
displayURL="https://patreon.com/Da_Slimy"

description='''
EngineCore [v1.0.0 - MC 1.21.11] - High-performance modular server & client engine optimizer for Minecraft NeoForge 1.21.11:

• Dynamic Mob AI Throttling: Intelligently throttles idle and distant entity ticking without affecting named mobs, ridden vehicles, or combat aggro.
• Entity Blacklist / Whitelist: Built-in registry whitelist/blacklist to keep specific boss or modded mobs at full tick rates.
• Farm Animal & Breeding Optimizer: Throttles idle mate/plant searches for passive livestock in dense pens.
• Ground Item Merge Optimizer: Dramatically reduces tick cost from mass item drops (explosions, quarries, mob farms).
• GC & Memory Allocation Optimizer: Reuses pooled BlockPos and scratch collision boxes to eliminate garbage collection stuttering.
• Safe Redstone Update Batcher: Coalesces cascading block updates with an instant 0-tick bypass for sensitive redstone circuits.
• Native In-Game Configuration GUI: Seamlessly adjust distances, intervals, module switches, and presets (Safe, Norm, Max) straight from the pause/mod menu.

Support ongoing development on Patreon: https://patreon.com/Da_Slimy
'''

[[dependencies.enginecore]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.enginecore]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
