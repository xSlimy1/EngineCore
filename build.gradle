plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = project.mod_version
group = 'com.enginecore'

base {
    archivesName = 'enginecore'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
// Explicit alongside the toolchain above: some IDE/CI configurations resolve source/target
// compatibility before the toolchain is applied, so both are set to avoid ambiguity.
java.sourceCompatibility = JavaVersion.VERSION_17
java.targetCompatibility = JavaVersion.VERSION_17

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} " +
        "(${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { enginecore { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { enginecore { source sourceSets.main } }
        }
    }
}

// ---------------------------------------------------------------------------------------
// Mixin annotation-processor + refmap wiring. `priority = 1000` is set on every @Mixin
// class itself (not here) so EngineCore's transforms apply after low-priority compat
// shims but stays compatible with Sodium/Embeddium (client rendering, no overlap),
// FerriteCore (memory layout, no overlap) and ModernFix (loading-time, no overlap).
// ---------------------------------------------------------------------------------------
mixin {
    add sourceSets.main, 'enginecore.refmap.json'
    config 'enginecore.mixins.json'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version: project.forge_version,
            forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: 'enginecore',
            mod_name: 'EngineCore',
            mod_license: 'MIT',
            mod_version: project.mod_version,
            mod_authors: 'EngineCore Team',
            mod_description: 'Modular tick-loop, GC and redstone performance optimizer.'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'enginecore',
                'Specification-Vendor'    : 'EngineCore Team',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'EngineCore Team',
                'MixinConfigs'            : 'enginecore.mixins.json'
        ])
    }
}
